apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taraining-app.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taraining-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ $.Values.nginx.name }}-service
                port:
                  number: {{ $.Values.nginx.containerPort }}
              {{- end }}
        {{- end }}
